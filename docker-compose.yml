# ==============================================================================
# FoodRescue — Full Stack Docker Compose (Frontend + Backend + Supabase DB)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend GraphQL API (NestJS + Prisma)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodrescue_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - NODE_ENV=production
    networks:
      - foodrescue_network

  # ----------------------------------------------------------------------------
  # Frontend Web Client (Next.js 16)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
    container_name: foodrescue_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
    depends_on:
      - backend
    networks:
      - foodrescue_network

networks:
  foodrescue_network:
    driver: bridge
