# ==========================================================================
# FoodRescue — Docker Compose
# Spins up two containers:
#   1. postgres  — PostgreSQL 16 database
#   2. pgadmin   — pgAdmin 4 web UI to manage the database
# ==========================================================================
#
# Usage:
#   docker compose up -d          # Start both services in the background
#   docker compose down           # Stop and remove containers
#   docker compose down -v        # Stop, remove containers AND volumes (wipes DB data)
#   docker compose logs -f        # Follow logs from all services
#
# After starting:
#   • Database is available at: localhost:5432
#   • pgAdmin UI is available at: http://localhost:5050
#     Login: admin@foodrescue.com / admin123
#     (Add server: host=postgres, port=5432, db=foodrescue, user=foodrescue, pass=foodrescue_pass)
#
# Ensure your backend/.env contains:
#   DATABASE_URL="postgresql://foodrescue:foodrescue_pass@localhost:5433/foodrescue?schema=public"
# ==========================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 — Primary Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: foodrescue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodrescue
      POSTGRES_USER: foodrescue
      POSTGRES_PASSWORD: foodrescue_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodrescue_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodrescue -d foodrescue']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # pgAdmin 4 — Web-Based PostgreSQL Management UI
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: foodrescue_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@foodrescue.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # Auto-configure the server connection so you don't have to add it manually
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - foodrescue_network

# --------------------------------------------------------------------------
# Named Volumes — data survives container restarts
# --------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# --------------------------------------------------------------------------
# Network
# --------------------------------------------------------------------------
networks:
  foodrescue_network:
    driver: bridge
